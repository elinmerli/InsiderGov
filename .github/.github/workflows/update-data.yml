
name: Update InsiderGov Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download official FEC data
        run: |
          mkdir -p data
          python - <<'PY'
          import urllib.request, zipfile, io, csv, json, datetime

          url = "https://www.fec.gov/files/bulk-downloads/2026/webl26.zip"
          req = urllib.request.Request(url, headers={"User-Agent":"InsiderGov/1.0"})
          raw = urllib.request.urlopen(req, timeout=120).read()

          z = zipfile.ZipFile(io.BytesIO(raw))
          name = next(n for n in z.namelist()
                      if n.lower().endswith((".txt", ".csv")))
          content = z.read(name).decode("latin-1")

          columns = [
            "candidate_id","name","incumbent_status","party_code",
            "party","total_receipts","transfers_received",
            "total_disbursements","transfers_given","cash_beginning",
            "cash_on_hand","candidate_contributions","candidate_loans",
            "other_loans","candidate_loan_repayments",
            "other_loan_repayments","debts_owed","individual_contributions",
            "state","district","special_election","primary_election",
            "runoff_election","general_election","general_election_percent",
            "committee_contributions","party_contributions",
            "coverage_end_date","individual_refunds","committee_refunds"
          ]

          records = []
          reader = csv.reader(io.StringIO(content), delimiter="|")

          for row in reader:
              if len(row) < len(columns):
                  continue
              item = dict(zip(columns, [v.strip() for v in row]))
              if item["candidate_id"] == "CAND_ID":
                  continue
              for key in (
                  "total_receipts","total_disbursements","cash_on_hand",
                  "individual_contributions","debts_owed"
              ):
                  try:
                      item[key] = float(item[key] or 0)
                  except ValueError:
                      item[key] = 0
              records.append(item)

          if not records:
              raise RuntimeError("FEC archive returned no usable records")

          output = {
              "source": "Federal Election Commission",
              "source_url": url,
              "updated_at": datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(),
              "count": len(records),
              "records": records
          }

          with open("data/fec-campaigns.json","w",encoding="utf-8") as f:
              json.dump(output,f,ensure_ascii=False)

          print("Saved records:", len(records))
          PY

      - name: Save updated data
        run: |
          git config user.name "InsiderGov Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fec-campaigns.json
          git diff --cached --quiet || git commit -m "Update official FEC data"
          git push
