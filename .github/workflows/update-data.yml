
name: Update InsiderGov Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Download FEC campaign data
        shell: bash
        run: |
          set -e
          mkdir -p data
          python - <<'PY'
          import urllib.request, zipfile, io, csv, json, datetime

          url = "https://www.fec.gov/files/bulk-downloads/2026/webl26.zip"
          request = urllib.request.Request(
              url, headers={"User-Agent": "InsiderGov/1.0"}
          )

          with urllib.request.urlopen(request, timeout=180) as response:
              archive = response.read()

          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              files = [
                  n for n in z.namelist()
                  if n.lower().endswith((".txt", ".csv"))
              ]
              if not files:
                  raise RuntimeError("No CSV/TXT file in FEC archive")

              content = z.read(files[0]).decode("latin-1")

          columns = [
              "candidate_id", "name", "incumbent_status", "party_code",
              "party", "total_receipts", "transfers_received",
              "total_disbursements", "transfers_given", "cash_beginning",
              "cash_on_hand", "candidate_contributions", "candidate_loans",
              "other_loans", "candidate_loan_repayments",
              "other_loan_repayments", "debts_owed", "individual_contributions",
              "state", "district", "special_election", "primary_election",
              "runoff_election", "general_election",
              "general_election_percent", "committee_contributions",
              "party_contributions", "coverage_end_date",
              "individual_refunds", "committee_refunds"
          ]

          records = []
          for row in csv.reader(io.StringIO(content), delimiter="|"):
              if len(row) < len(columns):
                  continue
              item = dict(zip(columns, row))
              if item["candidate_id"] == "CAND_ID":
                  continue
              for key in [
                  "total_receipts", "total_disbursements",
                  "cash_on_hand", "individual_contributions", "debts_owed"
              ]:
                  try:
                      item[key] = float(item[key] or 0)
                  except ValueError:
                      item[key] = 0
              records.append(item)

          if not records:
              raise RuntimeError("FEC archive contained no records")

          output = {
              "source": "Federal Election Commission",
              "source_url": url,
              "updated_at": datetime.datetime.now(
                  datetime.timezone.utc
              ).isoformat(),
              "count": len(records),
              "records": records
          }

          with open("data/fec-campaigns.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False)

          print("Imported", len(records), "FEC records")
          PY

      - name: Commit updated data
        run: |
          git config user.name "InsiderGov Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/fec-campaigns.json
          git diff --cached --quiet || git commit -m "Update FEC campaign data"
          git push
